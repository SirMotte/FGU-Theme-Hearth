on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

name: Create Release

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check

      - name: Lint & Build Extension
        run: |
          python3 build.py --extract-inline-lua /tmp/inline_lua
          luacheck --config .luacheckrc . /tmp/inline_lua
          python3 build.py
          mv out/Theme_SirMotte_Hearth.ext .

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "Theme_SirMotte_Hearth.ext"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
