name: Lua & XML Linting

on:
  push:
    branches:
      - Hearth-Edition-Main
      - Hearth-Edition-Dev
  pull_request:
    branches:
      - Hearth-Edition-Main
      - Hearth-Edition-Dev
  workflow_dispatch:

jobs:
  lint:
    name: Run Luacheck & FGU XML Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check

      - name: Run Luacheck Linter
        run: |
          python3 build.py --extract-inline-lua /tmp/inline_lua
          luacheck --config .luacheckrc . /tmp/inline_lua

      - name: Run FGU XML Static Validator
        run: python3 build.py --validate-only
